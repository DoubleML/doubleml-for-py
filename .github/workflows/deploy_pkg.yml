name: CI deploy package

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # Required for dynamic versioning

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: DoubleML-pkg
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI 🧪
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/DoubleML
    permissions:
      id-token: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v6
        with:
          name: DoubleML-pkg
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # Prevents failure on re-runs

  verify-testpypi:
    name: Verify TestPyPI Install 🕵️
    needs: publish-to-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for TestPyPI indexing
        run: sleep 60

      - name: Install from TestPyPI
        # --extra-index-url allows pip to find dependencies (pandas, numpy) on the real PyPI
        if: github.event_name == 'release'
        run: pip install --pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "DoubleML==${{ github.ref_name }}"

      - name: Install from TestPyPI (workflow_dispatch)
        # For manual runs, install the latest pre-release version
        if: github.event_name == 'workflow_dispatch'
        run: pip install --pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ DoubleML

      - name: Import Smoke Test
        run: python -c "import doubleml; print(f'Successfully imported DoubleML version {doubleml.__version__}')"

  publish-to-pypi:
    name: Publish to PyPI 🚀
    needs: verify-testpypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release' # Do not publish on workflow_dispatch
    environment:
      name: pypi
      url: https://pypi.org/p/DoubleML
    permissions:
      id-token: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v6
        with:
          name: DoubleML-pkg
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify PyPI Install 🕵️
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for PyPI indexing
        run: sleep 60

      - name: Install from PyPI
        run: pip install "DoubleML==${{ github.ref_name }}"

      - name: Import Smoke Test
        run: python -c "import doubleml; print(f'Successfully imported DoubleML version {doubleml.__version__}')"

  update-citation:
    name: Update CITATION.cff 📝
    needs: verify-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Set version and date-released
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          VERSION="${TAG_NAME#v}"
          RELEASE_DATE="${PUBLISHED_AT:0:10}"
          sed -i -e '/^version:/d' -e '/^date-released:/d' CITATION.cff
          sed -i "/^license:/a version: ${VERSION}\ndate-released: '${RELEASE_DATE}'" CITATION.cff

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet CITATION.cff; then
            echo "CITATION.cff already up to date"
            exit 0
          fi
          BRANCH="chore/citation-${TAG_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore: update CITATION.cff for ${TAG_NAME}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update CITATION.cff for ${TAG_NAME}" \
            --body "Automated update of \`version\` and \`date-released\` after release ${TAG_NAME}."
